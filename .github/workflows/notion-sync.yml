name: Notion Dashboard Sync

"on":
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '수동 실행 이유'
        required: false
        default: '수동 동기화'
  push:
    branches:
      - main
    paths:
      - 'scripts/sync_notion.py'
      - '.github/workflows/notion-sync.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    name: Notion 동기화 및 배포
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          pip install requests pytz --quiet

      - name: Notion 동기화 실행
        id: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MAIN_PAGE_ID: ${{ secrets.NOTION_MAIN_PAGE_ID }}
          NOTION_DASHBOARD_PAGE_ID: ${{ secrets.NOTION_DASHBOARD_PAGE_ID }}
        run: |
          python scripts/sync_notion.py

      - name: 변경사항 감지
        id: check
        run: |
          if git diff --quiet data/dashboard.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "변경 없음 - 커밋 스킵"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "변경 감지 - 커밋 진행"
          fi

      - name: 커밋 및 푸시
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git commit -m "auto sync: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 실행 결과 요약
        if: always()
        run: |
          echo "================================================"
          echo "아산시 스마트시티 대시보드 동기화 완료"
          echo "실행: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S KST')"
          echo "URL : https://leesungho-ai.github.io/Asan-Smartcity-integration-Portal/"
          echo "================================================"
