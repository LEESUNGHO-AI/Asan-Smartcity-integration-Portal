name: Notion Dashboard Sync

"on":
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/notion-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    name: Notion 동기화 및 배포
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests pytz --quiet

      - name: Notion 블록 파싱 및 동기화
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DASHBOARD_PAGE_ID: ${{ secrets.NOTION_DASHBOARD_PAGE_ID }}
        run: |
          python3 - << 'PYEOF'
          import json, os, re, requests
          from datetime import datetime, timezone, timedelta

          KST       = timezone(timedelta(hours=9))
          NOW       = datetime.now(KST)
          TOKEN     = os.environ.get("NOTION_TOKEN", "")
          PAGE_ID   = os.environ.get("NOTION_DASHBOARD_PAGE_ID", "2aa50aa9577d817da233c79ce0c441fe")
          OUT_PATH  = "data/dashboard.json"
          HEADERS   = {"Authorization": f"Bearer {TOKEN}", "Notion-Version": "2022-06-28"}

          print("=" * 55)
          print("  아산시 스마트시티 Notion 블록 파싱 동기화")
          print(f"  실행: {NOW.strftime('%Y-%m-%d %H:%M:%S KST')}")
          print(f"  토큰: {'있음' if TOKEN else '없음'}")
          print("=" * 55)

          # ── 유틸 ──────────────────────────────────────────
          def notion_get(url):
              try:
                  r = requests.get(url, headers=HEADERS, timeout=15)
                  return r.json() if r.status_code == 200 else None
              except:
                  return None

          def get_all_blocks(block_id):
              blocks, cursor = [], ""
              while True:
                  url = f"https://api.notion.com/v1/blocks/{block_id}/children?page_size=100"
                  if cursor: url += f"&start_cursor={cursor}"
                  data = notion_get(url)
                  if not data: break
                  blocks.extend(data.get("results", []))
                  cursor = data.get("next_cursor", "")
                  if not data.get("has_more"): break
              return blocks

          def get_table_rows(table_id):
              rows = []
              data = notion_get(f"https://api.notion.com/v1/blocks/{table_id}/children?page_size=100")
              if data:
                  for row in data.get("results", []):
                      if row["type"] == "table_row":
                          rows.append([
                              "".join(t.get("plain_text","") for t in cell)
                              for cell in row["table_row"]["cells"]
                          ])
              return rows

          def rt(block, key):
              return "".join(t.get("plain_text","") for t in block[key]["rich_text"])

          def clean(t):
              return re.sub(r"\*+", "", t).strip()

          def parse_amount(t):
              m = re.search(r"([\d.]+)억", clean(t))
              return float(m.group(1)) if m else 0.0

          def parse_rate(t):
              m = re.search(r"([\d.]+)%", clean(t))
              return float(m.group(1)) if m else 0.0

          def parse_status(s):
              """이모지 접두어 우선 → 텍스트 fallback"""
              if s.startswith("✅"): return "completed"
              if s.startswith("🆕"): return "pending"
              if s.startswith("⏸"): return "pending"
              if s.startswith("🔄"): return "in_progress"
              if "진행" in s or "체결" in s: return "in_progress"
              if "완료" in s or "운영" in s: return "completed"
              return "pending"

          def parse_risk_level(t):
              if "긴급" in t: return "urgent"
              if "높음" in t: return "high"
              return "mid"

          # ── 기존 JSON 로드 ────────────────────────────────
          existing = {}
          try:
              with open(OUT_PATH, "r", encoding="utf-8") as f:
                  existing = json.load(f)
              print("  기존 dashboard.json 로드 성공")
          except FileNotFoundError:
              print("  신규 생성")

          # ── 타임스탬프 & D-Day ───────────────────────────
          existing["lastUpdated"] = NOW.strftime("%Y-%m-%dT%H:%M:%S+09:00")
          existing["basis"]       = NOW.strftime("%Y-%m-%d")
          existing.setdefault("summary", {})
          existing["summary"].setdefault("endDate",     "2026-12-31")
          existing["summary"].setdefault("totalBudget", 240)
          end_dt = datetime.strptime(existing["summary"]["endDate"], "%Y-%m-%d").replace(tzinfo=KST)
          existing["summary"]["dday"] = (end_dt - NOW).days

          # ── Notion 블록 파싱 ──────────────────────────────
          if not TOKEN:
              print("  NOTION_TOKEN 없음 - 타임스탬프/D-Day만 갱신")
          else:
              print(f"  블록 로딩: {PAGE_ID}")
              blocks = get_all_blocks(PAGE_ID)
              print(f"  블록 {len(blocks)}개 로드")

              SECTIONS = {
                  "핵심 현황": "summary", "단위사업 현황": "units",
                  "재원별 예산": "budget", "리스크": "risk", "주요 일정": "schedule",
              }
              section = None
              units, budget_sources, risks, schedule = [], [], [], []
              risk_level = "mid"
              summary_lines = []

              for b in blocks:
                  bt = b["type"]

                  # 헤딩 → 섹션 감지
                  if bt in ("heading_1","heading_2","heading_3"):
                      heading = rt(b, bt)
                      section = next((v for k,v in SECTIONS.items() if k in heading), None)

                  # 불릿
                  elif bt == "bulleted_list_item":
                      text = "".join(t.get("plain_text","") for t in b["bulleted_list_item"]["rich_text"])
                      if section == "summary": summary_lines.append(text)
                      elif section == "risk":  risks.append({"level": risk_level, "content": text.strip()})

                  # 단락 (리스크 단계 헤더)
                  elif bt == "paragraph":
                      text = "".join(t.get("plain_text","") for t in b["paragraph"]["rich_text"])
                      if section == "risk" and text.strip():
                          risk_level = parse_risk_level(text)

                  # 테이블
                  elif bt == "table":
                      rows = get_table_rows(b["id"])
                      if len(rows) < 2: continue
                      data_rows = rows[1:]

                      if section == "units":
                          for r in data_rows:
                              if len(r) >= 6 and r[0].strip():
                                  units.append({
                                      "no": r[0].strip(), "name": r[1].strip(),
                                      "budget": parse_amount(r[2]), "budgetText": clean(r[2]),
                                      "executed": parse_amount(r[3]) if r[3] not in ("—","-","") else 0,
                                      "executedText": clean(r[3]),
                                      "rate": parse_rate(r[4]),
                                      "status": r[5].strip(), "statusCode": parse_status(r[5]),
                                  })
                          print(f"  단위사업 {len(units)}개 파싱")

                      elif section == "budget":
                          for r in data_rows:
                              if len(r) >= 5 and clean(r[0]) not in ("합계",""):
                                  budget_sources.append({
                                      "source": clean(r[0]),
                                      "total": parse_amount(r[1]), "totalText": clean(r[1]),
                                      "executed": parse_amount(r[2]), "executedText": clean(r[2]),
                                      "rate": parse_rate(r[3]),
                                      "balance": parse_amount(r[4]), "balanceText": clean(r[4]),
                                  })
                          print(f"  재원별 예산 {len(budget_sources)}개 파싱")

                      elif section == "schedule":
                          for r in data_rows:
                              if len(r) >= 4 and r[0].strip():
                                  schedule.append({
                                      "date": r[0].strip(), "type": r[1].strip(),
                                      "content": r[2].strip(), "status": r[3].strip(),
                                  })
                          print(f"  일정 {len(schedule)}개 파싱")

              # 핵심현황 파싱
              for line in summary_lines:
                  if "예산 집행" in line or "집행률" in line:
                      if "/" in line:
                          exc = parse_amount(line.split("/")[0])
                          if exc: existing["summary"]["executed"] = exc
                      rate = parse_rate(line)
                      if rate: existing["summary"]["executionRate"] = rate
                      m = re.search(r"잔액\s*([\d.]+)억", line)
                      if m: existing["summary"]["balance"] = float(m.group(1))
                  if "진도율" in line:
                      rate = parse_rate(line)
                      if rate: existing["summary"]["progress"] = rate

              s = existing["summary"]
              print(f"  핵심현황: 집행률={s.get('executionRate')}%, 진도율={s.get('progress')}%")
              print(f"  리스크: 긴급 {sum(1 for r in risks if r['level']=='urgent')}건 / 높음 {sum(1 for r in risks if r['level']=='high')}건 / 주의 {sum(1 for r in risks if r['level']=='mid')}건")

              if units:          existing["units"]         = units
              if budget_sources: existing["budgetSources"] = budget_sources
              if risks:          existing["risks"]         = risks
              if schedule:       existing["schedule"]      = schedule

          # ── 저장 ──────────────────────────────────────────
          os.makedirs("data", exist_ok=True)
          with open(OUT_PATH, "w", encoding="utf-8") as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)

          print("=" * 55)
          print(f"  저장 완료: {OUT_PATH}")
          print(f"  D-{existing['summary']['dday']} (2026.12.31 기준)")
          print("=" * 55)
          PYEOF

      - name: 변경사항 커밋 및 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git add data/dashboard.json
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 스킵"
          else
            git commit -m "auto sync: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            git push origin main
            echo "커밋 완료"
          fi
