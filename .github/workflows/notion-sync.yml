name: Notion Dashboard Sync

"on":
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/notion-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    name: Notion 동기화 및 배포
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests pytz --quiet

      - name: Notion 동기화 실행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DASHBOARD_PAGE_ID: ${{ secrets.NOTION_DASHBOARD_PAGE_ID }}
        run: |
          python3 - << 'PYEOF'
          import json, os, requests
          from datetime import datetime, timezone, timedelta

          KST = timezone(timedelta(hours=9))
          NOW = datetime.now(KST)
          NOTION_TOKEN = os.environ.get("NOTION_TOKEN", "")
          OUTPUT_PATH = "data/dashboard.json"

          print("=" * 50)
          print("아산시 스마트시티 Notion 동기화 시작")
          print(f"실행: {NOW.strftime('%Y-%m-%d %H:%M:%S KST')}")
          print(f"토큰: {'있음' if NOTION_TOKEN else '없음 (기본값 사용)'}")
          print("=" * 50)

          existing = {}
          try:
              with open(OUTPUT_PATH, "r", encoding="utf-8") as f:
                  existing = json.load(f)
              print("기존 dashboard.json 로드 성공")
          except FileNotFoundError:
              print("dashboard.json 없음 - 신규 생성")
          except Exception as e:
              print(f"로드 오류: {e}")

          existing["lastUpdated"] = NOW.strftime("%Y-%m-%dT%H:%M:%S+09:00")
          existing["basis"] = NOW.strftime("%Y-%m-%d")
          existing.setdefault("summary", {})
          existing["summary"].setdefault("endDate", "2026-12-31")
          end_dt = datetime.strptime(existing["summary"]["endDate"], "%Y-%m-%d").replace(tzinfo=KST)
          existing["summary"]["dday"] = (end_dt - NOW).days

          if NOTION_TOKEN:
              page_id = os.environ.get("NOTION_DASHBOARD_PAGE_ID", "")
              if page_id:
                  try:
                      r = requests.get(
                          f"https://api.notion.com/v1/blocks/{page_id}/children?page_size=10",
                          headers={
                              "Authorization": f"Bearer {NOTION_TOKEN}",
                              "Notion-Version": "2022-06-28",
                          },
                          timeout=15
                      )
                      if r.status_code == 200:
                          print(f"Notion API 연결 성공 - 블록 {len(r.json().get('results', []))}개")
                      else:
                          print(f"Notion API 응답: {r.status_code}")
                  except Exception as e:
                      print(f"Notion API 오류: {e}")
              else:
                  print("NOTION_DASHBOARD_PAGE_ID 없음")
          else:
              print("NOTION_TOKEN 없음 - 타임스탬프/D-Day만 갱신")

          os.makedirs("data", exist_ok=True)
          with open(OUTPUT_PATH, "w", encoding="utf-8") as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)

          print(f"저장 완료: {OUTPUT_PATH}")
          print(f"D-{existing['summary']['dday']} (2026.12.31 기준)")
          PYEOF

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 스킵"
          else
            git pull --rebase origin main
            git push origin main
            echo "커밋 완료"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
