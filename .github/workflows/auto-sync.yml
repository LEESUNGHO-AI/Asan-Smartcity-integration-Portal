name: 대시보드 Notion 자동 동기화

on:
  # ── 30분마다 자동 실행
  schedule:
    - cron: "*/30 * * * *"

  # ── 수동 실행 (Actions 탭에서 "Run workflow" 클릭)
  workflow_dispatch:

  # ── Notion Webhook 수신 시 즉시 실행 (선택사항)
  # repository_dispatch:
  #   types: [notion-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write   # git push 권한

    steps:
      # 1. 저장소 체크아웃
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Python 설정
      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. 의존성 설치
      - name: 📦 패키지 설치
        run: pip install requests

      # 4. 대시보드 생성 (Notion API → index.html)
      - name: 🔄 대시보드 생성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BUDGET_PAGE_ID: ${{ secrets.NOTION_BUDGET_PAGE_ID }}
        run: python scripts/generate_dashboard.py

      # 5. 변경사항 커밋 & 푸시
      - name: 📤 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html data/snapshot.json

          # 변경사항이 있을 때만 커밋
          if git diff --cached --quiet; then
            echo "ℹ️ 변경사항 없음 - 커밋 생략"
          else
            git commit -m "🔄 대시보드 자동 갱신 $(date +'%Y-%m-%d %H:%M KST' --date='9 hours')"
            git push
            echo "✅ 푸시 완료"
          fi
