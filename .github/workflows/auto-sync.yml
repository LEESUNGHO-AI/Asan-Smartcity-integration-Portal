name: 대시보드 Notion 자동 동기화

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # cache: pip 제거 → requirements.txt 없어도 동작

      - name: 📦 패키지 설치
        run: pip install requests

      - name: 🔄 대시보드 생성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BUDGET_PAGE_ID: ${{ secrets.NOTION_BUDGET_PAGE_ID }}
        run: python scripts/generate_dashboard.py

      - name: 📤 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/snapshot.json
          if git diff --cached --quiet; then
            echo "ℹ️ 변경사항 없음 - 커밋 생략"
          else
            git commit -m "🔄 대시보드 자동 갱신 $(date +'%Y-%m-%d %H:%M' -d '+9 hours') KST"
            git push
            echo "✅ 푸시 완료"
          fi
