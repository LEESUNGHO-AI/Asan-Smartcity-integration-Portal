# ─────────────────────────────────────────────────────────────
# [사용 중지] 정적 대시보드 자동생성 워크플로
#
# 통합포털이 브라우저에서 BMS·WBS JSON을 실시간으로 직접 조회하는
# 방식(클라이언트 사이드)으로 전환됨에 따라, 서버측 정적 생성
# (generate_dashboard.py → index.html 커밋)은 더 이상 필요하지 않습니다.
#
# 이 워크플로가 계속 돌면 실시간 index.html을 정적 스냅샷으로
# 덮어써 데이터가 다시 어긋나므로, 자동 스케줄을 비활성화합니다.
# (수동 실행은 남겨두되 index.html은 건드리지 않습니다.)
# ─────────────────────────────────────────────────────────────
name: (중지됨) 대시보드 정적 생성

on:
  workflow_dispatch:   # 수동으로만 실행 가능. 자동 스케줄(cron) 제거.

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: 안내
        run: |
          echo "이 워크플로는 중지되었습니다."
          echo "통합포털은 이제 실시간 클라이언트 방식으로 동작합니다."
          echo "정적 생성이 다시 필요하면 scripts/generate_dashboard.py 를 수동 실행하세요."
